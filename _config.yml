# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
avatar: /avatar.svg
title: CAYZLH
subtitle: 'CODE IS POETRY'
description: '多读书，多看报，少吃零食多睡觉～'
keywords:
author: Ant丶
language:
  - zh-CN
  - en
  - zh-TW
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://www.cayzlh.com
root: /
permalink: post/:abbrlink/
abbrlink:
  alg: crc32  # 算法：crc16(default) and crc32
  rep: dec    # 进制：dec(default) and hex
permalink_defaults:
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: false # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
wiki_dir: wiki
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.txt
  - '_posts/**/embed_page/**'
  - googlef9cffebfc312ff74.html
  - logo.png
  - 'custom/*.html'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## Use post's date for updated date unless set in front-matter
updated_option: false

# Pagination
## Set per_page to 0 to disable pagination
per_page: 100
pagination_dir: page
# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: polaris

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  - type: cjh_baidu_url_submitter
  - type: git
    repo: git@github.com:cayzlh/ubiquitous-winner.git
    branch: master
    message: deployment by GitHub Action.

marked:
  gfm: true

jsonContent:
  meta: false
  pages:
    title: true
    date: true
    path: true
    text: true
  posts:
    title: true
    date: true
    path: true
    text: true
    tags: true
    categories: true
  ignore:
    - 404.html

sitemap:
  path: sitemap.xml
  template: ./sitemap_template.xml
baidusitemap:
  path: baidusitemap.xml

hexo_submit_urls_to_search_engine:
  submit_condition: count #链接被提交的条件，可选值：count | period 现仅支持count
  count: 10 # 提交最新的10个链接
  period: 900 # 提交修改时间在 900 秒内的链接
  google: 0 # 是否向Google提交，可选值：1 | 0（0：否；1：是）
  bing: 0 # 是否向bing提交，可选值：1 | 0（0：否；1：是）
  baidu: 1 # 是否向baidu提交，可选值：1 | 0（0：否；1：是）
  txt_path: submit_urls.txt ## 文本文档名， 需要推送的链接会保存在此文本文档里
  baidu_host: https://www.cayzlh.com ## 在百度站长平台中注册的域名
  baidu_token: ew2sG5GeH255XkQO ## 请注意这是您的秘钥， 所以请不要把它直接发布在公众仓库里!
  bing_host: https://cjh0613.github.io ## 在bing站长平台中注册的域名
  bing_token: 请按照文档说明获取 ## 请注意这是您的秘钥， 所以请不要把它直接发布在公众仓库里!
  google_host: https://www.cayzlh.com ## 在google站长平台中注册的域名
  google_key_file: Project.json #存放google key的json文件，放于网站根目录（与hexo _config.yml文件位置相同），请不要把json文件内容直接发布在公众仓库里!
  replace: 1  # 是否替换链接中的部分字符串，可选值：1 | 0（0：否；1：是）
  find_what: https://www.cayzlh.com
  replace_with: https://www.cayzlh.com

nofollow:
  enable: true
  exclude:
    - www.cayzlh.com
    - cayzlh.com

#Feed Atom
feed:
  type: atom
  path: atom.xml
  limit: 0
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png
  autodiscovery: true
  template: ./atom_template.xml

inject:
  head:
    - <meta name="msapplication-TileColor" content="#2d89ef">
    - <meta name="msapplication-config" content="/assets/favicon/browserconfig.xml">
    - <meta name="theme-color" content="#ffffff">
    - <link rel="shortcut icon" href="https://cdn-cf.cayzlh.com/logo/favicon.ico">
    - <link rel="icon" type="image/png" href="https://cdn-cf.cayzlh.com/logo/favicon-192x192.png" sizes="192x192">
    - <link rel="apple-touch-icon" sizes="180x180" href="https://cdn-cf.cayzlh.com/logo/apple-touch-icon.png">
    - <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.2.1/css/all.min.css">
#  script:
#    - https://cdn.jsdelivr.net/npm/jquery@3.5/dist/jquery.min.js
