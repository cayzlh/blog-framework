# .github/dependabot.yml
version: 2
updates:
  # npm 依赖更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    rebase-strategy: "auto"
    labels:
      - "dependencies"
    reviewers:
      - "cayzlh"
    groups:
      hexo-dependencies:
        patterns:
          - "hexo*"
          - "hexo-*"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        dependency-type: "production"
        update-types:
          - "security"
    ignore:
      - dependency-name: "hexo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hexo-cli"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 依赖更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "dependencies"
    reviewers:
      - "cayzlh"