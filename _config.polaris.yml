# Polaris Theme — Minimal and elegant Hexo theme
# https://cayzlh.com/

info:
  name: Polaris
  version: 3.0.0

# 主标题 & 副标题（来自站点 _config.yml 的 title / subtitle）
# title 显示在 header 左侧，subtitle 显示在 header 右侧

# Navigation links
# ========================================
# 导航菜单配置（支持下拉菜单）
# ========================================
# 字段说明：
#   name     - 菜单显示名称
#   url      - 链接地址（内部路径或完整 URL），有 children 时可省略
#   icon     - 可选，菜单项图标或指示符
#   children - 子菜单列表，有此字段则表示为下拉菜单
#   divider  - boolean，是否为分割线（仅用于 children 中）
#   target   - '_self'（同窗口）/ '_blank'（新窗口），默认 '_self'
menu:
  - name: 首页
    url: /
  - name: 文章
    url: /archives/
  - name: 档案
    url: /dossier/
  - name: 订阅
    url: /subscriptions/
  - name: 资讯
    url: /news/
  - name: 拾遗
    url: /curio/
  - name: 其他
    children:
      - name: 打印数独
        url: /custom/sudoku/
        target: _self

# =============================================
# Homepage
# =============================================

# Homepage intro
intro: |
  Hi，我是 [Ant丶](https://github.com/cayzlh)，欢迎你。

recent_posts_count: 3
recent_posts_title: '近日所思：'
random_posts_count: 3
random_posts_title: '旧文拾遗：'

# =============================================
# 分割线配置
# =============================================
hr:
  home_style: gradient
  post_style: short
  footer_style: ornament
  sidebar_style: double
  page_style: ornament
  width: 70%
  margin_vertical: 2.5em

# =============================================
# SEO
# =============================================

# Canonical URL & clone detection
canonical:
  originalHost: www.cayzlh.com
  officialHosts: ['cayzlh.com']
  checklink: /js/check.js
  closeEnable: false
  closeText: 关闭提示

# Favicon
favicon: https://cdn-cf.cayzlh.com/logo/favicon.ico

# Open Graph (social sharing)
open_graph:
  enable: true
  twitter_id: ''
  twitter_card: summary_large_image

# Structured data (JSON-LD)
structured_data:
  enable: true
  site_type: Person
  logo: ''

# =============================================
# Colors
# =============================================

color:
  # OnePage 暖白纸张：米白底 + 深青强调
  text: '#3D3730'
  text-light: '#79705F'
  text-muted: '#6B6255'
  background: '#FAF7F1'
  background-secondary: '#F3EFE7'
  background-tertiary: '#EDE8DE'
  link: '#0E6E63'
  link-hover: '#0A544B'
  accent: '#0E6E63'
  border: '#E6E0D4'
  border-dark: '#D5CCBB'
  code-bg: '#F3EFE7'
  code-border: '#E2DBCD'
  selection: '#E5DBCA'

# =============================================
# 链接样式配置
# =============================================
link:
  color: '#0E6E63'
  hover_color: '#0A544B'
  visited_color: '#0E6E63'
  underline: true
  underline_style: solid
  underline_opacity: 0.28

# Typography
# 等宽字体比同级 sans 更宽，18px 的观感相当于 sans 的 19-20px
# 实际生效值见 source/css/tokens.css 的 --fs / --lh / --mw
font_size: 16.5px
line_height: 1.72
max_width: 680px

# =============================================
# Dark Mode
# =============================================
dark_mode:
  mode: system                # auto | manual | system
  sunset: '19:00'
  sunrise: '06:00'
  switch_position: header

dark:
  # OnePage 暖棕·冷锚：暖棕底 + 冷青强调
  text: '#CFC7BD'
  text-light: '#A49C90'
  text-muted: '#948D83'
  background: '#262322'
  background-secondary: '#2D2927'
  background-tertiary: '#1F1C1B'
  link: '#6DB3A3'
  link-hover: '#8CC9BA'
  border: '#3A3532'
  code-bg: '#201D1C'
  hover-bg: '#332E2C'
  accent: '#6DB3A3'
  selection: '#43392F'

# =============================================
# 页面过渡动画配置
# =============================================
transition:
  enable: true
  # 降级方案类型：'view-transition' | 'fade'
  # view-transition: 优先使用 View Transitions API（浏览器原生），不支持时自动降级为 fade
  # fade: 始终使用 JS 淡入淡出
  type: view-transition
  # 动画时长（毫秒），与 CSS animation-duration 一致
  duration: 350

# =============================================
# TOC (Table of Contents)
# =============================================
toc:
  enable: true
  max_depth: 3                       # max heading depth (1-6)
  position: right                    # desktop position: right | left
  show_number: false                 # show heading numbers
  mobile_default: collapsed          # collapsed | expanded
  show_back_to_top: true             # show "back to top" button
  back_to_top_text: 回到顶部          # back to top button text
  auto_collapse: true                # auto collapse sub-headings, expand only current section
  # 光标跟随：滚动时高亮当前阅读标题
  highlight_on_scroll: true
  # 是否显示层级连接线（树形可视化）
  show_tree_line: true
  # 滚动条样式：'custom' | 'hidden' | 'default'
  scrollbar_style: custom
  # 是否启用渐变遮罩（顶部/底部渐变透明，暗示可滚动）
  gradient_mask: true
  threshold: 0.3
  font_size_base: 0.85rem
  width: 200px
  content_padding_right: 240px

# =============================================
# Dossier 档案系统（精简版—约定优于配置）
# =============================================
#
# 每个 Dossier 项目是一个目录，必须包含 index.md 作为项目首页。
# index.md 的 front-matter 提供项目配置（title / description / tags / sort）。
# 无需在 source/_data/dossier/ 下创建 YAML 配置文件。
#
# 配置优先级：index.md front-matter > _config.yml > _data/dossier/*.yml
#
dossier:
  enable: true
  path: dossier                        # URL 路径
  root_dir: dossier                    # 源文件目录
  # 菜单与导航
  show_in_menu: true                   # 是否显示在导航菜单中
  menu_name: 档案                       # 菜单名称
  # TOC
  show_toc: true                       # 是否显示 TOC
  toc_depth: 3                         # TOC 最大层级
  # 分页导航
  show_pagination: true                # 是否显示底部导航（上一篇/下一篇）
  # 排序（全局默认，单个页面可用 front-matter sort 覆盖）
  sort_by: sort                        # 'sort' | 'title' | 'date' | 'filename'
  sort_order: asc                      # 'asc' | 'desc'
  # 显示选项
  show_description: true               # 是否显示项目描述
  # 卡片显示配置
  card:
    show_tags: true
    show_description: true
    show_count: true
    description_lines: 2
    # 「开始阅读」入口
    show_start_button: true            # 是否显示「开始阅读」按钮
    start_button_text: 开始阅读         # 按钮文字
    start_button_style: default        # 按钮样式：'default' | 'minimal' | 'outline'

# =============================================
# Custom pages
# =============================================
custom_pages:
  enable: true
  dir: custom
  show_in_menu: false

# =============================================
# 移动端体验配置
# =============================================
mobile:
  # 是否启用移动端优化（总开关）
  enable: true
  # 是否启用汉堡菜单
  hamburger_menu: true
  # 移动端正文字号（px）
  body_font_size: 16
  # 是否显示 TOC 浮动按钮
  toc_fab: true
  # 是否启用页面切换动画（移动端建议关闭）
  transition_enabled: false
  # 触控目标最小尺寸（px）
  touch_target_size: 44

# =============================================
# Runtime (实时运行时间)
# =============================================
runtime:
  enable: true                          # 是否在页脚显示实时时钟和运行时长
  start_time: '2019-05-26 04:45:00'     # 起始时间，用于计算"已平稳运行"的时长

# =============================================
# Footer
# =============================================
footer:
  text: |
    所有未竟之言，皆可<a href="mailto:mail@cayzlh.com">寄往此处</a>
  copyright: '© 2019–2026 <a href="https://github.com/cayzlh" target="_blank" rel="noopener">Ant丶</a>'
  # 页脚导航
  links:
    - name: 访问统计
      url: https://stats.cayzlh.com
      external: true
    - name: 归档
      url: /archives/
    - name: 订阅
      url: /atom.xml

  # 十年之约 · 虫洞（2022-07-01 加入，在约第 5 年）
  # 页脚顶部一条「印章栏」：左=虫洞入口，右=官方成员标识。
  # 全部字段可配；模板不假设任何域名。enable 为 false 时整块不渲染。
  foreverblog:
    enable: true
    wormhole_text: 穿过虫洞
    wormhole_url: https://www.foreverblog.cn/go.html
    wormhole_title: 虫洞 · 随机访问十年之约成员博客
    site_text: 十年之约
    site_url: https://www.foreverblog.cn/
    site_title: 十年之约成员博客
    # 右侧官方标识：wormhole（虫洞按钮）| member（B 字标）| both | none
    mark: wormhole

  # 开往 · 友链接力（travellings.cn）
  # 入口放在页脚印章栏，和「穿过虫洞」并列。
  # mark: text  = 主题自绘细线地铁图标 + 「开往」（与整体字体系一致）
  # mark: image = 官方 b.png / w.png 徽章，按深浅色自动切换
  travellings:
    enable: true
    mark: text
    text: 开往
    url: https://www.travellings.cn/go.html
    title: 开往 · 友链接力
    # 仅 mark: image 时生效
    badge_light: https://www.travellings.cn/assets/b.png
    badge_dark: https://www.travellings.cn/assets/w.png

# =============================================
# 订阅页
# =============================================
subscriptions:
  page_note: '我一直在读的东西，按时间倒序排列。'

# =============================================
# Archive 归档页搜索
# =============================================
archive:
  search_enable: true
  search_placeholder: 你在找什么...?
  search_debounce: 200
  highlight_match: true
  show_match_count: true

# =============================================
# Daily News (每日资讯数据源)
# =============================================
daily:
  enable: true
  api_base: 'https://glance.cayzlh.com'
  zaobao:
    enable: true
  zhihu:
    enable: true
  weibo:
    enable: true