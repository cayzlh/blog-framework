# Polaris Theme — Minimal and elegant Hexo theme
# https://github.com/cayzlh/hexo-theme-polaris

info:
  name: Polaris
  version: 3.0.0

# 主标题 & 副标题（来自站点 _config.yml 的 title / subtitle）
# title 显示在 header 左侧，subtitle 显示在 header 右侧

# Navigation links
# ========================================
# 导航菜单配置（支持下拉菜单）
# ========================================
# 字段说明：
#   name     - 菜单显示名称
#   url      - 链接地址（内部路径或完整 URL），有 children 时可省略
#   icon     - 可选，菜单项图标或指示符
#   children - 子菜单列表，有此字段则表示为下拉菜单
#   divider  - boolean，是否为分割线（仅用于 children 中）
#   target   - '_self'（同窗口）/ '_blank'（新窗口），默认 '_self'
menu:
  - name: Home
    url: /
  - name: Blog
    url: /archives/
  - name: Dossier
    url: /dossier/
  - name: About
    url: /about/
  - name: News
    url: /news/
  - name: Rss
    url: /subscriptions/
  - name: Tools
    children:
      - name: 标签
        url: /tags/
      - name: 分类
        url: /categories/
      - name: 归档
        url: /archives/
      - name: ───────
        divider: true
      - name: 打印数独
        url: /custom/sudoku/
        target: _self
      - name: 在线工具
        url: /custom/demo.html
        target: _self
      - name: 作品集
        url: /custom/workspace.html

# =============================================
# Homepage
# =============================================

# Homepage intro
intro: |
  A brief introduction about yourself or your blog.

  Supports **Markdown** formatting. This text appears on the homepage.

  — Your Name

recent_posts_count: 5
recent_posts_title: 'Recent Posts:'
random_posts_count: 5
random_posts_title: 'Random posts:'

# =============================================
# 分割线配置
# =============================================
# 将分割线从功能性的「分隔元素」升级为具有设计感的「视觉停顿」。
#
# 可用样式：
#   gradient  — 渐变消退式（两端渐隐，适合首页文章之间）
#   short     — 短横线式（64px 居中，适合文章内章节分隔）
#   dotted    — 点线组合式（· — · — ·，适合文章收尾）
#   double    — 超细双线式（极淡双线，适合侧边栏/卡片内）
#   ornament  — 花饰分隔符（✦ ✦ ✦，适合 About 等独立页面）
#   dash-dot  — 点线花饰变体（— · — · —）
# =============================================
hr:
  # 首页文章之间分隔线样式（默认 gradient）
  home_style: gradient
  # 文章内章节分隔线样式（默认 short）
  post_style: short
  # 文章末尾/页脚分隔线样式（默认 ornament）
  footer_style: ornament
  # 侧边栏/卡片内分隔线样式（默认 double）
  sidebar_style: double
  # About 等独立页面分隔线样式（默认 ornament）
  page_style: ornament
  # 分割线宽度（百分比或像素，仅对 gradient 生效）
  width: 70%
  # 分割线上下间距
  margin_vertical: 2.5em

# =============================================
# SEO
# =============================================

# Canonical URL & clone detection
# Set originalHost to your domain to enable clone detection.
canonical:
  originalHost: ''            # e.g. 'www.example.com'
  officialHosts: []           # e.g. ['example.com']
  checklink: /js/check.js
  closeEnable: true
  closeText: 关闭提示

# Open Graph (social sharing)
open_graph:
  enable: true
  twitter_id: ''
  twitter_card: summary_large_image

# Structured data (JSON-LD)
structured_data:
  enable: true
  site_type: Person
  logo: ''

# =============================================
# Colors
# =============================================

color:
  text: '#2C2A28'
  text-light: '#A09C96'
  text-muted: '#6B6864'
  background: '#F4F3EF'
  background-secondary: '#FAFAF7'
  background-tertiary: '#F0EFEB'
  link: '#8B6B4D'
  link-hover: '#6D4F3A'
  accent: '#8B6B4D'
  border: '#E5E2DC'
  border-dark: '#D4CEC6'
  code-bg: '#EDECE8'
  code-border: '#E0DED9'
  selection: '#E5E2DC'

# =============================================
# 链接样式配置
# =============================================
link:
  color: '#8B6B4D'
  hover_color: '#6D4F3A'
  visited_color: '#7c3aed'
  underline: true
  underline_style: solid
  underline_opacity: 0.25

# Typography
font_size: 18px
line_height: 1.75
max_width: 680px

# =============================================
# Dark Mode
# =============================================
dark_mode:
  mode: manual                # auto | manual | system
  sunset: '19:00'
  sunrise: '06:00'
  switch_position: header

dark:
  text: '#EEEEEE'
  text-light: '#C0C0C0'
  text-muted: '#888888'
  background: '#252525'
  background-secondary: '#2D2D2D'
  background-tertiary: '#1E1E1E'
  link: '#6BB5FF'
  link-hover: '#A0CCFF'
  border: '#3D3D3D'
  code-bg: '#2D2D2D'
  hover-bg: '#2D2D2D'
  accent: '#6BB5FF'
  selection: '#3D3D3D'

# =============================================
# 页面过渡动画配置
# =============================================
transition:
  enable: true
  # 降级方案类型：'view-transition' | 'fade'
  # view-transition: 优先使用 View Transitions API（浏览器原生），不支持时自动降级为 fade
  # fade: 始终使用 JS 淡入淡出
  type: view-transition
  # 动画时长（毫秒），与 CSS animation-duration 一致
  duration: 350

# =============================================
# TOC (Table of Contents)
# =============================================
toc:
  enable: true
  max_depth: 3                       # max heading depth (1-6)
  position: right                    # desktop position: right | left
  show_number: false                 # show heading numbers
  mobile_default: collapsed          # collapsed | expanded
  show_back_to_top: true             # show "back to top" button
  back_to_top_text: 回到顶部          # back to top button text
  auto_collapse: true                # auto collapse sub-headings, expand only current section
  # 光标跟随：滚动时高亮当前阅读标题
  highlight_on_scroll: true
  # 是否显示层级连接线（树形可视化）
  show_tree_line: true
  # 滚动条样式：'custom' | 'hidden' | 'default'
  scrollbar_style: custom
  # 是否启用渐变遮罩（顶部/底部渐变透明，暗示可滚动）
  gradient_mask: true
  threshold: 0.3
  font_size_base: 0.85rem
  width: 200px
  content_padding_right: 240px

# =============================================
# Dossier 档案系统（精简版—约定优于配置）
# =============================================
#
# 每个 Dossier 项目是一个目录，必须包含 index.md 作为项目首页。
# index.md 的 front-matter 提供项目配置（title / description / tags / sort）。
# 无需在 source/_data/dossier/ 下创建 YAML 配置文件。
#
# 配置优先级：index.md front-matter > _config.yml > _data/dossier/*.yml
#
dossier:
  enable: true
  path: dossier                        # URL 路径
  root_dir: dossier                    # 源文件目录
  # 菜单与导航
  show_in_menu: true                   # 是否显示在导航菜单中
  menu_name: 档案                       # 菜单名称
  # TOC
  show_toc: true                       # 是否显示 TOC
  toc_depth: 3                         # TOC 最大层级
  # 分页导航
  show_pagination: true                # 是否显示底部导航（上一篇/下一篇）
  # 排序（全局默认，单个页面可用 front-matter sort 覆盖）
  sort_by: sort                        # 'sort' | 'title' | 'date' | 'filename'
  sort_order: asc                      # 'asc' | 'desc'
  # 显示选项
  show_description: true               # 是否显示项目描述
  # 卡片显示配置
  card:
    show_tags: true
    show_description: true
    show_count: true
    description_lines: 2
    # 「开始阅读」入口
    show_start_button: true            # 是否显示「开始阅读」按钮
    start_button_text: 开始阅读         # 按钮文字
    start_button_style: default        # 按钮样式：'default' | 'minimal' | 'outline'

# =============================================
# Custom pages
# =============================================
custom_pages:
  enable: true
  dir: custom
  show_in_menu: false

# =============================================
# 移动端体验配置
# =============================================
mobile:
  # 是否启用移动端优化（总开关）
  enable: true
  # 是否启用汉堡菜单
  hamburger_menu: true
  # 移动端正文字号（px）
  body_font_size: 16
  # 是否显示 TOC 浮动按钮
  toc_fab: true
  # 是否启用页面切换动画（移动端建议关闭）
  transition_enabled: false
  # 触控目标最小尺寸（px）
  touch_target_size: 44

# =============================================
# 订阅页面配置
# =============================================
# 在 hexo generate 时抓取 RSS/Atom 订阅源，生成 /subscriptions/ 页面
#
# 数据来源：source/_data/subscriptions.yml
#
subscriptions:
  # 每个源默认抓取条数
  default_limit: 3
  # 是否显示订阅源描述
  show_description: true
  # 是否显示更新条数
  show_count: true
  # 页面标题
  page_title: 订阅
  # 页面描述模板（%d 会被替换为成功抓取的订阅源数量）
  page_subtitle: '正在关注 %d 个博客'
  # 请求超时（毫秒）
  timeout: 10000

# =============================================
# Runtime (实时运行时间)
# =============================================
runtime:
  enable: true                          # 是否在页脚显示实时时钟和运行时长
  start_time: '2020-01-01 00:00:00'     # 起始时间，用于计算"已平稳运行"的时长


# =============================================
# Footer
# =============================================
footer:
  text: |
    Stay in touch — subscribe via <a href="/atom.xml">RSS</a>, or send comments by email to <a href="mailto:hello@example.com">hello@example.com</a>
  # copyright: '© 2020–2026 Your Name'   # Uncomment to override the auto-generated © {year} {author}

# =============================================
# Archive 归档页搜索
# =============================================
archive:
  # 是否启用搜索功能
  search_enable: true
  # 搜索框占位文字
  search_placeholder: 搜索文章标题...
  # 搜索防抖延迟（毫秒）
  search_debounce: 200
  # 是否高亮匹配关键词
  highlight_match: true
  # 是否显示搜索匹配数量
  show_match_count: true

# =============================================
# Alapi (每日资讯数据源)
# =============================================
# API 数据源配置，驱动 /news/ 页面的三个 Tab：
#   每日早报 / 知乎日报 / 微博热搜
#
# Token 获取：https://alapi.cn
#
# 缓存机制：首次构建后写入 .daily_cache.json，同一天内重复构建不再请求 API，
#           避免本地开发（hexo server）频繁消耗免费额度。
#
# Token 直接填写在上方 alapi.token 中
alapi:
  # 总开关（false 时所有资讯显示空状态，可用于本地开发）
  enable: true
  # API Token（建议通过环境变量或站点 _config.yml 设置，此处留空）
  token: 'gfweyja2xjcn9afftymjwwmarjykvz'
  # 每日早报
  zaobao:
    enable: true
  # 知乎日报
  zhihu:
    enable: true
  # 微博热搜
  weibo:
    enable: true
